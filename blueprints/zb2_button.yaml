blueprint:
  name: Third Reality Smart Button ZB2 (Z2M)
  description: >
    Automate actions for the Third Reality Smart Button (ZB2) using Zigbee2MQTT.
    Since Z2M buttons are stateless, this blueprint listens for momentary button events.
    It supports both the modern Home Assistant `event` entities and legacy `sensor` action entities.
  domain: automation
  input:
    button_entity:
      name: Button Entity
      description: "Select the Event entity (e.g., event.smart_button_action) or Action sensor (e.g., sensor.smart_button_action) for your Third Reality button."
      selector:
        entity:
          filter:
            - domain: event
            - domain: sensor
    single_press:
      name: Single Press Action
      description: Action(s) to run when the button is pressed once.
      default: []
      selector:
        action: {}
    double_press:
      name: Double Press Action
      description: Action(s) to run when the button is pressed twice.
      default: []
      selector:
        action: {}
    hold_press:
      name: Hold Action
      description: Action(s) to run when the button is held down.
      default: []
      selector:
        action: {}
    release_press:
      name: Release Action
      description: Action(s) to run when the button is released (usually after being held).
      default: []
      selector:
        action: {}

mode: restart
max_exceeded: silent

trigger:
  - platform: state
    entity_id: !input button_entity
    not_from:
      - "unavailable"
      - "unknown"
      - ""

action:
  - variables:
      # Automatically determine if the entity is an event domain or sensor domain to grab the correct payload
      action_type: >
        {% if trigger.to_state.domain == 'event' %}
          {{ trigger.to_state.attributes.event_type }}
        {% else %}
          {{ trigger.to_state.state }}
        {% endif %}
  
  # Ensure the automation only continues if the payload matches a known button press type
  - condition: template
    value_template: "{{ action_type in ['single', 'double', 'hold', 'release'] }}"
    
  - choose:
      - conditions:
          - condition: template
            value_template: "{{ action_type == 'single' }}"
        sequence: !input single_press
        
      - conditions:
          - condition: template
            value_template: "{{ action_type == 'double' }}"
        sequence: !input double_press
        
      - conditions:
          - condition: template
            value_template: "{{ action_type == 'hold' }}"
        sequence: !input hold_press

      - conditions:
          - condition: template
            value_template: "{{ action_type == 'release' }}"
        sequence: !input release_press
