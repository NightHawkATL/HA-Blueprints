blueprint:
  name: Third Reality Smart Button S3 (Z2M)
  description: Automate actions for all 3 buttons on the Third Reality S3 using Zigbee2MQTT.
  domain: automation
  input:
    button_entity:
      name: Button Entity
      description: "Select the Action sensor for your S3 button."
      selector:
        entity:
          filter:
            - domain: event
            - domain: sensor
    b1_single:
      name: Button 1 - Single Press
      default: []
      selector: { action: {} }
    b1_double:
      name: Button 1 - Double Press
      default: []
      selector: { action: {} }
    b1_hold:
      name: Button 1 - Hold
      default: []
      selector: { action: {} }
    b1_release:
      name: Button 1 - Release
      default: []
      selector: { action: {} }
      
    b2_single:
      name: Button 2 - Single Press
      default: []
      selector: { action: {} }
    b2_double:
      name: Button 2 - Double Press
      default: []
      selector: { action: {} }
    b2_hold:
      name: Button 2 - Hold
      default: []
      selector: { action: {} }
    b2_release:
      name: Button 2 - Release
      default: []
      selector: { action: {} }

    b3_single:
      name: Button 3 - Single Press
      default: []
      selector: { action: {} }
    b3_double:
      name: Button 3 - Double Press
      default: []
      selector: { action: {} }
    b3_hold:
      name: Button 3 - Hold
      default: []
      selector: { action: {} }
    b3_release:
      name: Button 3 - Release
      default: []
      selector: { action: {} }

# Parallel mode allows multiple presses/delays simultaneously
mode: parallel
max: 10
max_exceeded: silent

trigger:
  - platform: state
    entity_id: !input button_entity

action:
  - variables:
      # Single-line template guarantees no hidden spaces or newlines break our conditions
      action_type: "{{ trigger.to_state.attributes.event_type if trigger.to_state.domain == 'event' else trigger.to_state.state }}"
        
  # Filter out "clearing" events and unavailability so they don't trigger blank actions
  - condition: template
    value_template: "{{ action_type not in ['unknown', 'unavailable', '', 'None'] }}"
    
  - choose:
      - conditions:
          - condition: template
            value_template: "{{ action_type == 'single_1' }}"
        sequence: !input b1_single
      - conditions:
          - condition: template
            value_template: "{{ action_type == 'double_1' }}"
        sequence: !input b1_double
      - conditions:
          - condition: template
            value_template: "{{ action_type == 'hold_1' }}"
        sequence: !input b1_hold
      - conditions:
          - condition: template
            value_template: "{{ action_type == 'release_1' }}"
        sequence: !input b1_release

      - conditions:
          - condition: template
            value_template: "{{ action_type == 'single_2' }}"
        sequence: !input b2_single
      - conditions:
          - condition: template
            value_template: "{{ action_type == 'double_2' }}"
        sequence: !input b2_double
      - conditions:
          - condition: template
            value_template: "{{ action_type == 'hold_2' }}"
        sequence: !input b2_hold
      - conditions:
          - condition: template
            value_template: "{{ action_type == 'release_2' }}"
        sequence: !input b2_release

      - conditions:
          - condition: template
            value_template: "{{ action_type == 'single_3' }}"
        sequence: !input b3_single
      - conditions:
          - condition: template
            value_template: "{{ action_type == 'double_3' }}"
        sequence: !input b3_double
      - conditions:
          - condition: template
            value_template: "{{ action_type == 'hold_3' }}"
        sequence: !input b3_hold
      - conditions:
          - condition: template
            value_template: "{{ action_type == 'release_3' }}"
        sequence: !input b3_release
